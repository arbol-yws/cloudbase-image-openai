services:
  cloudbase-image-openai:
    build: .
    image: cloudbase-image-openai:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
    ports:
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
